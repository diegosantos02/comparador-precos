<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercheap - Comparador de Preços</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121214; color: #e1e1e6; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 260px; background-color: #202024; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #323238; height: 100vh; overflow-y: auto; }
        .logo { font-size: 1.5em; font-weight: bold; color: #00e5ff; margin-bottom: 30px; text-align: center; cursor: pointer; }
        .menu-section { margin-bottom: 30px; }
        .menu-title { font-size: 0.8em; color: #7c7c8a; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
        .menu-item { color: #c4c4cc; text-decoration: none; display: block; margin-bottom: 10px; font-size: 0.9em; cursor: pointer; }
        .menu-item:hover { color: #00e5ff; }
        
        .login-box { margin-top: 20px; padding-top: 20px; border-top: 1px solid #323238; }
        .login-input { background-color: #121214; border: 1px solid #323238; padding: 8px; border-radius: 5px; width: 100%; color: white; margin-bottom: 8px; font-size: 0.85em; }
        .btn-acao { width: 100%; background-color: #00e5ff; color: #121214; border: none; padding: 8px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-bottom: 6px; transition: 0.2s; font-size: 0.85em; }
        .btn-acao:hover { opacity: 0.9; }
        .btn-secundario { background-color: transparent; border: 1px solid #00e5ff; color: #00e5ff; }
        
        .user-info { font-size: 0.85em; color: #00e5ff; word-break: break-all; margin-bottom: 10px; }
        .btn-logout { background: transparent; border: 1px solid #ff5555; color: #ff5555; padding: 5px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 0.8em; }

        .main-content { flex: 1; padding: 30px; height: 100vh; overflow-y: auto; }
        
        .top-controls { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; }
        .search-bar { background-color: #202024; border: 1px solid #323238; padding: 12px; border-radius: 8px; flex: 1; color: white; font-size: 0.95em; }
        .select-ordenacao { background-color: #202024; border: 1px solid #323238; padding: 12px; border-radius: 8px; color: #00e5ff; font-weight: bold; cursor: pointer; font-size: 0.9em; outline: none; }

        .section-title { font-size: 1.2em; border-bottom: 2px solid #323238; padding-bottom: 10px; margin-bottom: 20px; color: #e1e1e6; }
        
        .grid-produtos { display: flex; flex-wrap: wrap; gap: 20px; padding-bottom: 20px; }
        .card { background-color: #202024; border: 1px solid #323238; border-radius: 8px; padding: 15px; width: 240px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .card:hover { border-color: #00e5ff; }
        .card-img-container { height: 140px; background-color: #121214; border-radius: 5px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 10px; }
        .card img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .card-title { font-size: 0.85em; color: #e1e1e6; margin-bottom: 10px; height: 38px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .card-price { font-size: 1.2em; font-weight: bold; color: #00e5ff; margin-bottom: 5px; }
        .card-vendor { font-size: 0.75em; color: #7c7c8a; margin-bottom: 12px; }
        
        .card-buttons { display: flex; flex-direction: column; gap: 8px; }
        .btn-oferta { display: block; background-color: transparent; border: 1px solid #00e5ff; color: #00e5ff; text-decoration: none; padding: 7px; border-radius: 5px; font-weight: bold; font-size: 0.85em; text-align: center; }
        .btn-desejo { background-color: #323238; border: none; color: #c4c4cc; padding: 6px; border-radius: 5px; font-size: 0.8em; cursor: pointer; }
        .btn-desejo:hover { background-color: #00e5ff; color: #121214; }
        .btn-remover { background-color: #323238; border: none; color: #ff5555; padding: 6px; border-radius: 5px; font-size: 0.8em; cursor: pointer; }
        .btn-remover:hover { background-color: #ff5555; color: white; }

        .pagination { display: flex; justify-content: center; align-items: center; gap: 15px; padding: 30px 0; }
        .page-btn { background-color: #202024; border: 1px solid #323238; color: #00e5ff; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .page-btn:hover:not(:disabled) { background-color: #00e5ff; color: #121214; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        #page-info { color: #c4c4cc; font-size: 0.9em; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div>
            <div class="logo" onclick="carregarProdutos()">Mercheap</div>
            <div class="menu-section">
                <div class="menu-title">Navegação</div>
                <a class="menu-item" onclick="carregarDesejos()">❤️ Lista de Desejos</a>
                <a class="menu-item">🔔 Alertas de Preço</a>
            </div>
        </div>

        <div class="login-box" id="auth-container">
            <div class="menu-title">Minha Conta</div>
            <div id="form-login">
                <input type="email" id="login-email" class="login-input" placeholder="Seu e-mail">
                <input type="password" id="login-senha" class="login-input" placeholder="Sua senha">
                <button class="btn-acao" onclick="fazerLogin()">Fazer Login</button>
                <button class="btn-acao btn-secundario" onclick="fazerCadastro()">Criar Nova Conta</button>
            </div>
            <div id="perfil-usuario" style="display: none;">
                <p class="user-info" id="user-email-display"></p>
                <button class="btn-logout" onclick="fazerLogout()">Sair</button>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div class="top-controls">
            <input type="text" class="search-bar" id="input-pesquisa" placeholder="Ex: Notebook, Monitor, Placa de Vídeo, Mouse..." oninput="filtrarProdutos(this.value)">
            <select class="select-ordenacao" id="select-ordenacao" onchange="ordenarProdutos()">
                <option value="padrao">Ordenar por: Relevância</option>
                <option value="menor-preco">📉 Menor Preço</option>
                <option value="maior-preco">📈 Maior Preço</option>
            </select>
        </div>

        <h2 class="section-title" id="titulo-secao">Recomendações em Destaque</h2>
        
        <div class="grid-produtos" id="grid-produtos">
            <p style="color: #7c7c8a;">Carregando produtos...</p>
        </div>

        <div class="pagination" id="pagination-controls" style="display: none;">
            <button class="page-btn" id="btn-anterior" onclick="mudarPagina(-1)">← Anterior</button>
            <span id="page-info">Página 1 de 1</span>
            <button class="page-btn" id="btn-proxima" onclick="mudarPagina(1)">Próxima →</button>
        </div>
    </main>

    <script>
        const API_URL = 'https://comparador-precos-ovyp.onrender.com';
        let listaGlobalProdutos = [];
        let listaProdutosExibidos = [];
        let modoDesejosAtivo = false;
        
        let paginaAtual = 1;
        const itensPorPagina = 16;

        async function carregarProdutos() {
            modoDesejosAtivo = false;
            paginaAtual = 1;
            document.getElementById('input-pesquisa').value = '';
            document.getElementById('select-ordenacao').value = 'padrao';
            document.getElementById('titulo-secao').innerText = 'Recomendações em Destaque';
            try {
                const resposta = await fetch(`${API_URL}/api/produtos`);
                const dadosBrutos = await resposta.json();
                
                listaGlobalProdutos = dadosBrutos.filter(p => p.nome && p.nome !== "Sem Nome" && p.nome !== "Produto Sem Nome" && parseFloat(p.preco) > 0);
                listaProdutosExibidos = [...listaGlobalProdutos];
                
                renderizarPagina();
            } catch (erro) { console.error(erro); }
        }

        function ordenarProdutos() {
            const criterio = document.getElementById('select-ordenacao').value;

            if (criterio === 'menor-preco') {
                listaProdutosExibidos.sort((a, b) => parseFloat(a.preco) - parseFloat(b.preco));
            } else if (criterio === 'maior-preco') {
                listaProdutosExibidos.sort((a, b) => parseFloat(b.preco) - parseFloat(a.preco));
            } else {
                // Padrão (reaplica o filtro atual ou ordem original)
                filtrarProdutos(document.getElementById('input-pesquisa').value);
                return;
            }

            paginaAtual = 1;
            renderizarPagina();
        }

        function filtrarProdutos(termo) {
            const termoBusca = termo.toLowerCase().trim();
            
            let baseBusca = modoDesejosAtivo ? (() => {
                const usuarioId = localStorage.getItem('usuarioId');
                const idsDesejos = JSON.parse(localStorage.getItem('desejos_' + usuarioId) || '[]');
                return listaGlobalProdutos.filter(p => idsDesejos.includes(String(p.id)));
            })() : listaGlobalProdutos;

            if (!termoBusca) {
                listaProdutosExibidos = [...baseBusca];
            } else {
                const palavras = termoBusca.split(/\s+/);
                
                listaProdutosExibidos = baseBusca.filter(p => {
                    const nomeProduto = (p.nome || '').toLowerCase();
                    return palavras.every(palavra => nomeProduto.includes(palavra));
                });
            }

            // Aplica a ordenação atual caso esteja selecionada
            const criterio = document.getElementById('select-ordenacao').value;
            if (criterio === 'menor-preco') {
                listaProdutosExibidos.sort((a, b) => parseFloat(a.preco) - parseFloat(b.preco));
            } else if (criterio === 'maior-preco') {
                listaProdutosExibidos.sort((a, b) => parseFloat(b.preco) - parseFloat(a.preco));
            }
            
            paginaAtual = 1;
            renderizarPagina();
        }

        async function fazerCadastro() {
            const email = document.getElementById('login-email').value;
            const senha = document.getElementById('login-senha').value;
            if(!email || !senha) return alert('Preencha e-mail e senha!');

            try {
                const resposta = await fetch(`${API_URL}/api/cadastrar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });
                const dados = await resposta.json();
                if(dados.sucesso) {
                    localStorage.setItem('usuarioId', dados.usuarioId);
                    localStorage.setItem('userEmail', dados.email);
                    atualizarEstadoLogin();
                    alert('Conta criada com sucesso!');
                } else { alert(dados.erro); }
            } catch (e) { alert('Erro no cadastro.'); }
        }

        async function fazerLogin() {
            const email = document.getElementById('login-email').value;
            const senha = document.getElementById('login-senha').value;
            if(!email || !senha) return alert('Preencha e-mail e senha!');

            try {
                const resposta = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });
                const dados = await resposta.json();
                if(dados.sucesso) {
                    localStorage.setItem('usuarioId', dados.usuarioId);
                    localStorage.setItem('userEmail', dados.email);
                    atualizarEstadoLogin();
                    alert('Login efetuado!');
                } else { alert(dados.erro); }
            } catch (e) { alert('Erro no login.'); }
        }

        function atualizarEstadoLogin() {
            const id = localStorage.getItem('usuarioId');
            const email = localStorage.getItem('userEmail');
            if(id) {
                document.getElementById('form-login').style.display = 'none';
                document.getElementById('perfil-usuario').style.display = 'block';
                document.getElementById('user-email-display').innerText = email;
            } else {
                document.getElementById('form-login').style.display = 'block';
                document.getElementById('perfil-usuario').style.display = 'none';
            }
        }

        function fazerLogout() {
            localStorage.clear();
            atualizarEstadoLogin();
            carregarProdutos();
        }

        function adicionarDesejo(produtoId) {
            const usuarioId = localStorage.getItem('usuarioId');
            if(!usuarioId) return alert('Faça login para salvar itens na Lista de Desejos!');
            
            let desejos = JSON.parse(localStorage.getItem('desejos_' + usuarioId) || '[]');
            if(!desejos.includes(String(produtoId))) {
                desejos.push(String(produtoId));
                localStorage.setItem('desejos_' + usuarioId, JSON.stringify(desejos));
                renderizarPagina();
            }
        }

        function removerDesejo(produtoId) {
            const usuarioId = localStorage.getItem('usuarioId');
            let desejos = JSON.parse(localStorage.getItem('desejos_' + usuarioId) || '[]');
            desejos = desejos.filter(id => id !== String(produtoId));
            localStorage.setItem('desejos_' + usuarioId, JSON.stringify(desejos));
            
            if (modoDesejosAtivo) {
                carregarDesejos();
            } else {
                renderizarPagina();
            }
        }

        function carregarDesejos() {
            const usuarioId = localStorage.getItem('usuarioId');
            if(!usuarioId) return alert('Faça login primeiro para ver sua lista.');
            
            modoDesejosAtivo = true;
            paginaAtual = 1;
            document.getElementById('input-pesquisa').value = '';
            document.getElementById('select-ordenacao').value = 'padrao';
            document.getElementById('titulo-secao').innerText = 'Sua Lista de Desejos';
            
            const idsDesejos = JSON.parse(localStorage.getItem('desejos_' + usuarioId) || '[]');
            listaProdutosExibidos = listaGlobalProdutos.filter(p => idsDesejos.includes(String(p.id)));
            
            renderizarPagina();
        }

        function mudarPagina(direcao) {
            const totalPaginas = Math.ceil(listaProdutosExibidos.length / itensPorPagina);
            paginaAtual += direcao;
            if (paginaAtual < 1) paginaAtual = 1;
            if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;
            renderizarPagina();
            document.querySelector('.main-content').scrollTop = 0;
        }

        function renderizarPagina() {
            const container = document.getElementById('grid-produtos');
            const pagControls = document.getElementById('pagination-controls');
            container.innerHTML = ''; 

            if (!listaProdutosExibidos || listaProdutosExibidos.length === 0) {
                container.innerHTML = '<p style="color: #7c7c8a;">Nenhum produto encontrado.</p>';
                pagControls.style.display = 'none';
                return;
            }

            pagControls.style.display = 'flex';
            const totalPaginas = Math.ceil(listaProdutosExibidos.length / itensPorPagina);
            if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;

            const inicio = (paginaAtual - 1) * itensPorPagina;
            const fim = inicio + itensPorPagina;
            const produtosDaPagina = listaProdutosExibidos.slice(inicio, fim);

            const usuarioId = localStorage.getItem('usuarioId');
            const desejos = JSON.parse(localStorage.getItem('desejos_' + usuarioId) || '[]');

            produtosDaPagina.forEach(produto => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const jaFavoritado = desejos.includes(String(produto.id));

                let botaoAcaoHTML = '';
                if (modoDesejosAtivo) {
                    botaoAcaoHTML = `
                        <button class="btn-remover" onclick="removerDesejo('${produto.id}')">🗑️ Remover dos Desejos</button>
                    `;
                } else {
                    if (jaFavoritado) {
                        botaoAcaoHTML = `
                            <button class="btn-desejo" style="background-color: #00e5ff; color: #121214; font-weight: bold;" disabled>✔️ Adicionado à Lista</button>
                        `;
                    } else {
                        botaoAcaoHTML = `
                            <button class="btn-desejo" onclick="adicionarDesejo('${produto.id}')">❤️ Adicionar aos Desejos</button>
                        `;
                    }
                }

                const placeholderImg = 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/65/No-Image-Placeholder.svg/330px-No-Image-Placeholder.svg.png';
                const imagemSrc = produto.imagem_url && produto.imagem_url.trim() !== '' && !produto.imagem_url.includes('Placeholder')
                    ? produto.imagem_url 
                    : placeholderImg;

                card.innerHTML = `
                    <div>
                        <div class="card-img-container">
                            <img src="${imagemSrc}" alt="${produto.nome || 'Produto'}" onerror="this.src='${placeholderImg}';">
                        </div>
                        <h3 class="card-title" title="${produto.nome}">${produto.nome || 'Produto sem nome'}</h3>
                        <p class="card-price">R$ ${parseFloat(produto.preco || 0).toFixed(2)}</p>
                        <p class="card-vendor">Vendido por: <strong>${produto.origem || 'Desconhecida'}</strong></p>
                    </div>
                    <div class="card-buttons">
                        <a href="${produto.link_afiliado || '#'}" target="_blank" class="btn-oferta">Ver Ofertas</a>
                        ${botaoAcaoHTML}
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('page-info').innerText = `Página ${paginaAtual} de ${totalPaginas || 1}`;
            document.getElementById('btn-anterior').disabled = paginaAtual === 1;
            document.getElementById('btn-proxima').disabled = paginaAtual === totalPaginas || totalPaginas === 0;
        }

        atualizarEstadoLogin();
        carregarProdutos();
    </script>
</body>
</html>
