<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercheap - Comparador de Preços</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121214; color: #e1e1e6; display: flex; min-height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 260px; background-color: #202024; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #323238; }
        .logo { font-size: 1.5em; font-weight: bold; color: #00e5ff; margin-bottom: 30px; text-align: center; }
        .menu-section { margin-bottom: 30px; }
        .menu-title { font-size: 0.8em; color: #7c7c8a; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
        .menu-item { color: #c4c4cc; text-decoration: none; display: block; margin-bottom: 10px; font-size: 0.9em; }
        
        /* Login Box na Sidebar */
        .login-box { margin-top: auto; padding-top: 20px; border-top: 1px solid #323238; }
        .login-input { background-color: #121214; border: 1px solid #323238; padding: 10px; border-radius: 5px; width: 100%; color: white; margin-bottom: 10px; font-size: 0.85em; }
        .btn-login { width: 100%; background-color: #00e5ff; color: #121214; border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-login:hover { opacity: 0.9; }

        /* Main Content */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .search-bar { background-color: #202024; border: 1px solid #323238; padding: 15px; border-radius: 8px; width: 100%; color: white; margin-bottom: 30px; }
        .section-title { font-size: 1.2em; border-bottom: 2px solid #323238; padding-bottom: 10px; margin-bottom: 20px; color: #e1e1e6; }
        
        /* Grid e Cards */
        .grid-produtos { display: flex; flex-wrap: wrap; gap: 20px; }
        .card { background-color: #202024; border: 1px solid #323238; border-radius: 8px; padding: 15px; width: 240px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .card:hover { border-color: #00e5ff; }
        .card-img-container { height: 140px; background-color: #121214; border-radius: 5px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 10px; }
        .card img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .card-title { font-size: 0.85em; color: #e1e1e6; margin-bottom: 10px; height: 38px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .card-price { font-size: 1.2em; font-weight: bold; color: #00e5ff; margin-bottom: 5px; }
        .card-vendor { font-size: 0.75em; color: #7c7c8a; margin-bottom: 12px; }
        
        /* Botões do Card */
        .card-buttons { display: flex; flex-direction: column; gap: 8px; }
        .btn-oferta { display: block; background-color: transparent; border: 1px solid #00e5ff; color: #00e5ff; text-decoration: none; padding: 7px; border-radius: 5px; font-weight: bold; font-size: 0.85em; transition: 0.3s; text-align: center; }
        .btn-oferta:hover { background-color: #00e5ff; color: #121214; }
        .btn-desejo { background-color: #323238; border: none; color: #c4c4cc; padding: 6px; border-radius: 5px; font-size: 0.8em; cursor: pointer; transition: 0.2s; }
        .btn-desejo:hover { background-color: #ff5555; color: white; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div>
            <div class="logo">Mercheap</div>
            <div class="menu-section">
                <div class="menu-title">Navegação</div>
                <a href="#" class="menu-item">❤️ Lista de Desejos</a>
                <a href="#" class="menu-item">🔔 Alertas de Preço</a>
            </div>
        </div>

        <!-- Painel de Login Restaurado -->
        <div class="login-box">
            <div class="menu-title">Minha Conta</div>
            <input type="email" class="login-input" placeholder="Seu e-mail acadêmico">
            <input type="password" class="login-input" placeholder="Sua senha">
            <button class="btn-login">Entrar</button>
        </div>
    </aside>

    <main class="main-content">
        <input type="text" class="search-bar" placeholder="Ex: Notebook Avell, Monitor Dell, Placa de Vídeo...">
        
        <h2 class="section-title">Recomendações em Destaque</h2>
        
        <div class="grid-produtos" id="grid-produtos">
            <p style="color: #7c7c8a;">Carregando produtos do servidor...</p>
        </div>
    </main>

    <script>
        async function carregarProdutos() {
            try {
                const resposta = await fetch('https://comparador-precos-ovyp.onrender.com/api/produtos');
                const produtos = await resposta.json();
                const container = document.getElementById('grid-produtos');
                
                container.innerHTML = ''; 

                if (produtos.length === 0) {
                    container.innerHTML = '<p style="color: #7c7c8a;">Nenhum produto encontrado no banco.</p>';
                    return;
                }

                produtos.forEach(produto => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div>
                            <div class="card-img-container">
                                <img src="${produto.imagem_url}" alt="${produto.nome}" onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/6/65/No-Image-Placeholder.svg/330px-No-Image-Placeholder.svg.png';">
                            </div>
                            <h3 class="card-title" title="${produto.nome}">${produto.nome}</h3>
                            <p class="card-price">R$ ${parseFloat(produto.preco).toFixed(2)}</p>
                            <p class="card-vendor">Vendido por: <strong>${produto.origem}</strong></p>
                        </div>
                        <div class="card-buttons">
                            <a href="${produto.link_afiliado}" target="_blank" class="btn-oferta">Ver Ofertas</a>
                            <button class="btn-desejo" onclick="alert('Produto adicionado à Lista de Desejos!')">❤️ Adicionar aos Desejos</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (erro) {
                console.error('Erro:', erro);
                document.getElementById('grid-produtos').innerHTML = '<p style="color: #ff5555;">Erro ao conectar com o servidor.</p>';
            }
        }
        carregarProdutos();
    </script>
</body>
</html>
