<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercheap - Comparador de Preços</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121214; color: #e1e1e6; display: flex; min-height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 250px; background-color: #202024; padding: 20px; display: flex; flex-direction: column; border-right: 1px solid #323238; }
        .logo { font-size: 1.5em; font-weight: bold; color: #00e5ff; margin-bottom: 30px; text-align: center; }
        .menu-section { margin-bottom: 30px; }
        .menu-title { font-size: 0.8em; color: #7c7c8a; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
        .menu-item { color: #c4c4cc; text-decoration: none; display: block; margin-bottom: 10px; font-size: 0.9em; }
        
        /* Main Content */
        .main-content { flex: 1; padding: 30px; }
        .search-bar { background-color: #202024; border: 1px solid #323238; padding: 15px; border-radius: 8px; width: 100%; color: white; margin-bottom: 30px; }
        .section-title { font-size: 1.2em; border-bottom: 2px solid #323238; padding-bottom: 10px; margin-bottom: 20px; color: #e1e1e6; }
        
        /* Grid e Cards */
        .grid-produtos { display: flex; flex-wrap: wrap; gap: 20px; }
        .card { background-color: #202024; border: 1px solid #323238; border-radius: 8px; padding: 15px; width: 240px; text-align: center; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); border-color: #00e5ff; }
        .card-img-container { height: 150px; background-color: #121214; border-radius: 5px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .card img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .card-title { font-size: 0.9em; color: #e1e1e6; margin-bottom: 10px; height: 35px; overflow: hidden; }
        .card-price { font-size: 1.3em; font-weight: bold; color: #00e5ff; margin-bottom: 5px; }
        .card-vendor { font-size: 0.8em; color: #7c7c8a; margin-bottom: 15px; }
        .btn-oferta { display: block; background-color: transparent; border: 1px solid #00e5ff; color: #00e5ff; text-decoration: none; padding: 8px; border-radius: 5px; font-weight: bold; transition: 0.3s; }
        .btn-oferta:hover { background-color: #00e5ff; color: #121214; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">Mercheap</div>
        
        <div class="menu-section">
            <div class="menu-title">Navegação</div>
            <a href="#" class="menu-item">❤️ Lista de Desejos</a>
            <a href="#" class="menu-item">🔔 Alertas de Preço</a>
        </div>
    </aside>

    <main class="main-content">
        <input type="text" class="search-bar" placeholder="Ex: Notebook Avell, Monitor Dell...">
        
        <h2 class="section-title">Recomendações em Destaque</h2>
        
        <div class="grid-produtos" id="grid-produtos">
            <p style="color: #7c7c8a;">Carregando produtos do servidor...</p>
        </div>
    </main>

    <script>
        async function carregarProdutos() {
            try {
                // Conexão com o seu servidor na nuvem
                const resposta = await fetch('https://comparador-precos-ovyp.onrender.com/api/produtos');
                const produtos = await resposta.json();
                const container = document.getElementById('grid-produtos');
                
                container.innerHTML = ''; // Limpa o aviso de carregamento

                produtos.forEach(produto => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-img-container">
                            <img src="${produto.imagem_url}" alt="${produto.nome}" onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/6/65/No-Image-Placeholder.svg/330px-No-Image-Placeholder.svg.png';">
                        </div>
                        <h3 class="card-title">${produto.nome}</h3>
                        <p class="card-price">R$ ${parseFloat(produto.preco).toFixed(2)}</p>
                        <p class="card-vendor">Vendido por: <strong>${produto.origem}</strong></p>
                        <a href="${produto.link_afiliado}" target="_blank" class="btn-oferta">Ver Ofertas</a>
                    `;
                    container.appendChild(card);
                });
            } catch (erro) {
                console.error('Erro:', erro);
                document.getElementById('grid-produtos').innerHTML = '<p style="color: #ff5555;">Erro ao carregar o catálogo.</p>';
            }
        }
        carregarProdutos();
    </script>
</body>
</html>
