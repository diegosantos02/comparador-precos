<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador Universitário</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; padding: 20px; }
        h1 { text-align: center; color: #333; }
        .vitrine { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 10px; padding: 15px; width: 260px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between;}
        .card img { max-width: 100%; height: 200px; object-fit: contain; border-radius: 5px; margin-bottom: 10px; }
        .titulo { font-size: 1em; color: #444; margin: 0 0 10px 0; height: 40px; overflow: hidden; }
        .preco { font-size: 1.4em; font-weight: bold; color: #27ae60; margin: 5px 0; }
        .loja { font-size: 0.9em; color: #7f8c8d; font-weight: bold; text-transform: uppercase; margin-bottom: 15px; }
        .botao { text-align: center; background-color: #2980b9; color: white; padding: 10px; text-decoration: none; border-radius: 5px; font-weight: bold; transition: background 0.3s; }
        .botao:hover { background-color: #3498db; }
    </style>
</head>
<body>

    <h1>🎮 Comparador de Teclados Gamer</h1>
    
    <div class="vitrine" id="lista-produtos">
        <!-- O JavaScript vai injetar os teclados aqui dentro! -->
    </div>

    <script>
        async function carregarProdutos() {
            try {
                // 👇 AQUI ESTÁ A MUDANÇA: O site agora busca os dados na nuvem (Render)
                const resposta = await fetch('https://comparador-precos-ovyp.onrender.com/api/produtos');
                const produtos = await resposta.json();
                
                const container = document.getElementById('lista-produtos');

                produtos.forEach(produto => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    card.innerHTML = `
                        <img src="${produto.imagem_url}" alt="${produto.nome}" onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/6/65/No-Image-Placeholder.svg/330px-No-Image-Placeholder.svg.png';">
                        <h3 class="titulo">${produto.nome}</h3>
                        <p class="loja">🛒 ${produto.origem}</p>
                        <p class="preco">R$ ${parseFloat(produto.preco).toFixed(2)}</p>
                        <a href="${produto.link_afiliado}" target="_blank" class="botao">Ver Oferta</a>
                    `;
                    container.appendChild(card);
                });
            } catch (erro) {
                console.error('Erro ao conectar com o servidor:', erro);
                alert("Erro ao carregar os produtos. Verifique se o servidor Node está rodando!");
            }
        }

        carregarProdutos();
    </script>

</body>
</html>
