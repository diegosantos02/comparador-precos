name: Executar Scrapers Amazon e AliExpress

on:
  schedule:
    # Executa a cada 6 horas automaticamente
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite rodar manualmente com um clique na aba Actions

jobs:
  scraping:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip libxi6 libgconf-2-4 libnss3
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/googlechrome-linux-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/googlechrome-linux-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager psycopg2-binary requests

      - name: Executar Scraper Amazon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python crawler_amazon_autonomo.py

      - name: Executar Scraper AliExpress
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python crawler_aliexpress_scraping.py
